<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLR Application</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      width: 90%;
      text-align: center;
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
      color: #111827;
    }
    p {
      font-size: 1rem;
      color: #4b5563;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .badge {
      display: inline-block;
      background-color: #dcfce7;
      color: #166534;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.4rem 0.9rem;
      border-radius: 9999px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CLR Web Application</h1>
    <p>Deployment pipeline active. Container is up and serving static content cleanly.</p>
    <span class="badge">Status: Running</span>
  </div>
</body>
</html>
